name: sistema-aportes-limpio

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sistema-aportes-limpio-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - framework_cache:/var/www/html/storage/framework
    ports:
      - "8001:8000"
    command: sh -c "[ -f vendor/autoload.php ] || composer install; php artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - app_network
    restart: unless-stopped

networks:
  app_network:
    external: true
    name: sistema-aportes_default

volumes:
  framework_cache:
