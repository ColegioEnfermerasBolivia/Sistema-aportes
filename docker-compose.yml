services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: sistema-aportes-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: sistema-aportes-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sistema_aportes
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: sistema
      MYSQL_PASSWORD: sistema
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: